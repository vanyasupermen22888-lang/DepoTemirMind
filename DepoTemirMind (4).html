<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DepoTemirMind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #0b0f16; --bg2: #0e1420; --panel: #111925; --card: #141d2a; --line: #243146; --soft: #101823;
    --text: #f3f7fb; --muted: #9aa8bb;
    --accent: #25a8f0; --btn: #1b92d6; --btn-d: #1479b5; --gold: #c9931f; --gold-d: #a77a14;
    --warn: #f2b705; --signal: #ff4d5e; --ok: #2fd18a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: #0b0f16; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Montserrat", "Segoe UI", Roboto, Arial, sans-serif; }
  [hidden] { display: none !important; }
  .rails { display: none; }
  button, input, select { font-family: inherit; }

  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  .main .screen { height: auto; flex: 1; min-height: 0; }

  /* ---------- Шапка ---------- */
  #app { display: flex; flex-direction: column; height: 100%; }
  .top { flex: none; height: 76px; display: flex; align-items: center; gap: 22px; padding: 0 clamp(14px, 4vw, 56px); background: #0b0f16; border-bottom: 1px solid #1b2535; position: relative; z-index: 40; }
  .menu-btn { display: none; width: 42px; height: 42px; align-items: center; justify-content: center; background: transparent; border: none; color: #fff; cursor: pointer; }
  .menu-btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; white-space: nowrap; }
  .brand svg { width: 46px; height: 46px; flex: none; }
  .brand b { display: block; font-size: 19px; font-weight: 800; letter-spacing: .2px; color: var(--accent); line-height: 1.1; }
  .brand small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .nav { display: flex; align-items: center; gap: 4px; margin-left: 12px; flex: 1; }
  .mi { background: none; border: none; color: #fff; font-size: 15px; font-weight: 600; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .mi:hover { color: var(--accent); }
  .mi.on { color: var(--accent); border-bottom-color: var(--accent); }
  .user { text-align: right; font-size: 13px; line-height: 1.25; white-space: nowrap; }
  .user b { display: block; font-weight: 700; }
  .user span { color: var(--muted); font-size: 12px; }
  .out { background: var(--gold); border: none; color: #fff; border-radius: 4px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .out:hover { background: var(--gold-d); }
  .veil { display: none; }
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: radial-gradient(1200px 500px at 70% -10%, #15233a 0, transparent 60%), var(--bg); }

  @media (max-width: 960px) {
    .menu-btn { display: flex; }
    .top { gap: 10px; height: 68px; }
    .brand svg { width: 38px; height: 38px; }
    .brand b { font-size: 17px; }
    .brand small { display: none; }
    .user { display: none; }
    .fillm { flex: 1; }
    .out { padding: 10px 14px; font-size: 14px; margin-left: auto; }
    .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; margin: 0; flex-direction: column; align-items: stretch; gap: 0; background: #111925; border-bottom: 1px solid var(--line); box-shadow: 0 16px 30px rgba(0,0,0,.5); }
    .nav.open { display: flex; }
    .mi { text-align: left; padding: 16px 22px; border-bottom: 1px solid #1b2535; font-size: 16px; }
    .mi.on { border-bottom-color: #1b2535; background: #15202f; }
    .veil.show { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); }
  }

  /* ---------- Главная ---------- */
  #home.active { display: block; overflow-y: auto; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(14px, 4vw, 56px); }
  .eyebrow { color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin: 34px 0 10px; }
  .hl { font-size: clamp(28px, 5.2vw, 66px); font-weight: 800; line-height: 1.16; text-transform: uppercase; margin: 0 0 28px; letter-spacing: -.5px; }
  .scene { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .scene svg { width: 100%; height: auto; display: block; }
  .wh { transform-box: fill-box; transform-origin: center; transform: rotate(var(--rot, 0deg)); }
  .sg .rl, .sg .gl { opacity: 0; transition: opacity .45s; }
  .sg.g .gl, .sg.r .rl { opacity: 1; }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; margin: 38px 0 12px; }
  .stat { display: block; min-width: 0; }
  .stat .sh { display: flex; align-items: center; gap: 10px; }
  .stat svg { width: 38px; height: 38px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .stat b { font-size: clamp(28px, 3.4vw, 42px); font-weight: 800; line-height: 1; }
  .stat span { display: block; margin-top: 10px; font-size: 13px; font-weight: 600; line-height: 1.4; color: #dbe5f1; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; } }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 34px; }
  .tab { background: transparent; border: none; color: var(--accent); padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; }
  .tab:hover { background: #12202f; }
  .tab.on { background: var(--btn); color: #fff; }
  .tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
  .tbl th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 12px 14px; }
  .tbl td { padding: 15px 14px; vertical-align: top; }
  .tbl tbody tr:nth-child(odd) { background: rgba(255,255,255,.04); }
  .tbl tr.lnk { cursor: pointer; }
  .tbl tr.lnk:hover { background: #14263a; }
  .more { margin: 20px 0 56px; background: var(--gold); color: #fff; border: none; padding: 14px 26px; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .more:hover { background: var(--gold-d); }
  @media (max-width: 700px) { .tbl th:first-child, .tbl td:first-child { width: 92px; } }

  /* ---------- Внутренние страницы ---------- */
  .bar { display: flex; align-items: center; gap: 12px; padding: 24px clamp(14px, 4vw, 56px) 6px; flex: none; width: 100%; max-width: 1100px; margin: 0 auto; }
  .back { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--card); border: 1px solid var(--line); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .back:hover { background: #182438; }
  .back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .title { font-size: 20px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; }
  .content { flex: 1; overflow-y: auto; padding: 14px clamp(14px, 4vw, 56px) 48px; width: 100%; max-width: 1100px; margin: 0 auto; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 15px 18px; margin-bottom: 10px; color: var(--text); font-size: 16px; font-weight: 600; }
  button.row { cursor: pointer; }
  button.row:hover { background: #182438; }
  .row small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; margin-top: 3px; line-height: 1.4; }
  .chev { color: var(--accent); font-size: 22px; }
  .rt { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 20px; white-space: nowrap; background: rgba(255,255,255,.08); }
  .badge::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: currentColor; }
  .s-work { color: var(--ok); } .s-repair { color: var(--signal); } .s-reserve { color: var(--warn); }
  .cls-1 { color: var(--ok); } .cls-2 { color: var(--warn); } .cls-3 { color: var(--muted); }
  .dg-0 { color: var(--ok); } .dg-1 { color: var(--warn); } .dg-2 { color: var(--signal); }
  .t-passenger { color: var(--accent); } .t-freight { color: var(--ok); } .t-shunting { color: var(--warn); }

  .avatar { width: 92px; height: 92px; border-radius: 50%; margin: 6px auto 14px; background: #10243a; border: 3px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; }
  .pname { text-align: center; font-size: 21px; font-weight: 800; }
  .prole { text-align: center; color: var(--muted); margin: 4px 0 22px; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .info div { display: flex; justify-content: space-between; gap: 16px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .info div:last-child { border-bottom: none; }
  .info span:first-child { color: var(--muted); }
  .info span:last-child { font-weight: 700; text-align: right; }
  .note { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; line-height: 1.55; }
  .sec { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin: 6px 2px 10px; }
  .sec:not(:first-child) { margin-top: 24px; }
  .sec2 { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin: 14px 0 6px; }
  .mut { color: var(--muted); }
  .req { background: var(--soft); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; line-height: 1.45; font-size: 15px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 16px; }
  .seg button, .seg4 button { background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 12px 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .seg button:hover, .seg4 button:hover { background: #182438; }
  .seg button.on, .seg4 button.on { background: var(--btn); color: #fff; border-color: var(--btn); }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .acts button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 13px 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .acts button:hover { background: #182438; }
  .acts button.warnb { grid-column: 1 / -1; border-color: var(--accent); color: var(--accent); }

  .tl { margin-left: 8px; padding-left: 20px; border-left: 3px solid var(--accent); }
  .ev { position: relative; margin-bottom: 16px; }
  .ev::before { content: ""; position: absolute; left: -30px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
  .ev b { display: block; color: var(--accent); font-size: 15px; margin-bottom: 2px; }
  .ev span { line-height: 1.45; }

  .node { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .nh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; }
  .mrow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); margin: 10px 0 5px; }
  .mrow b { color: var(--text); }
  .mbar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  .mbar i { display: block; height: 100%; }
  .sp { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .sp svg { width: 100%; height: 30px; }
  .why { margin-top: 12px; font-size: 14px; line-height: 1.5; }
  .pl-crit { border-left-color: var(--signal) !important; }
  .pl-warn { border-left-color: var(--warn) !important; }
  .pl-plan { border-left-color: var(--line) !important; }
  .hn { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .hn summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 700; cursor: pointer; list-style: none; }
  .hn summary::-webkit-details-marker { display: none; }
  .hbody { padding: 0 16px 16px; }
  .hsp span { display: block; color: var(--muted); font-size: 13px; margin: 10px 0 4px; }
  .hsp svg { width: 100%; height: 48px; }
  .jr { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; line-height: 1.45; }
  .jr b { display: block; color: var(--text); }

  .sw { width: 50px; height: 28px; border-radius: 14px; background: #34425a; position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  [aria-checked="true"] .sw { background: var(--btn); }
  [aria-checked="true"] .sw::after { transform: translateX(22px); }
  .row.danger { border-left-color: var(--signal); color: var(--signal); cursor: pointer; }
  .row .val { color: var(--muted); font-weight: 500; }
  .stub-body { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .stub-body p { font-size: 22px; font-weight: 700; margin: 0; }

  /* ---------- Приоритеты, план ремонта ---------- */
  .pr-1 { color: var(--signal); } .pr-2 { color: var(--warn); } .pr-3 { color: var(--accent); }
  .rs-plan { color: var(--muted); } .rs-wait { color: var(--warn); } .rs-work { color: var(--accent); } .rs-parts { color: var(--signal); } .rs-done { color: var(--ok); }
  .pl-done { border-left-color: var(--ok) !important; }
  .rt { flex-wrap: wrap; justify-content: flex-end; }
  .rt.col { flex-direction: column; align-items: flex-end; gap: 6px; }
  .nh .rt { gap: 6px; }
  button.node { display: block; width: 100%; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
  button.node:hover { background: #182438; }
  .pbox { margin-top: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .pbox .pt { font-weight: 800; margin-bottom: 6px; }
  .pbox .pl { color: var(--muted); }
  .cnts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  @media (min-width: 961px) and (max-width: 1320px) { .mi { padding: 10px 8px; font-size: 14px; } .nav { margin-left: 4px; } .user { display: none; } }

  /* ---------- Чат ---------- */
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 860px; margin: 0 auto; }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px clamp(14px, 4vw, 56px); display: flex; flex-direction: column; gap: 10px; }
  .msgs.is-empty { justify-content: center; align-items: center; }
  .empty { text-align: center; color: var(--muted); font-size: 18px; line-height: 1.5; max-width: 340px; }
  .empty .ico { color: var(--accent); margin-bottom: 14px; display: flex; justify-content: center; }
  .empty .ico svg { width: 52px; height: 52px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bubble { max-width: 86%; padding: 12px 16px; border-radius: 14px; font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { align-self: flex-end; background: var(--btn); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-bottom-left-radius: 4px; }
  .bubble.err { color: var(--signal); }
  .composer { flex: none; display: flex; gap: 10px; align-items: flex-end; padding: 12px clamp(14px, 4vw, 56px) 20px; background: var(--bg2); border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; max-height: 120px; min-height: 46px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 23px; padding: 12px 18px; font: inherit; font-size: 16px; line-height: 1.3; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .send { width: 46px; height: 46px; flex: none; border-radius: 50%; border: none; cursor: pointer; background: var(--btn); color: #fff; display: flex; align-items: center; justify-content: center; }
  .send:disabled { opacity: .4; cursor: default; }
  .send svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Вход ---------- */
  #login { align-items: center; justify-content: center; padding: 20px; background: radial-gradient(900px 480px at 50% -10%, #17283f 0, transparent 60%), #0b0f16; }
  .lg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.55); max-width: 430px; width: 100%; padding: 30px 26px; }
  .lg h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; }
  .lg p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; font-size: 14px; }
  .lg .lock { color: var(--accent); margin-bottom: 12px; }
  .lg .lock svg { width: 46px; height: 46px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .rolebtn { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 15px 16px; margin-bottom: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .rolebtn:hover { background: #182438; }
  .pin { width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font: inherit; font-size: 22px; letter-spacing: 8px; text-align: center; outline: none; margin: 8px 0 12px; }
  .pin:focus { border-color: var(--accent); }
  .pbtn { width: 100%; background: var(--btn); color: #fff; border: none; border-radius: 4px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--btn-d); }
  .plink { background: none; border: none; color: var(--accent); margin-top: 12px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .perr { color: var(--signal); min-height: 22px; margin-top: 10px; font-size: 14px; }
  .fl { display: block; color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 0 14px; }
  .fl input, .fl select { display: block; width: 100%; margin-top: 6px; padding: 13px 14px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 16px; outline: none; }
  .fl input:focus, .fl select:focus { border-color: var(--accent); }
  .content .pbtn { margin: 6px 0 14px; display: block; }
  /* ---------- День / ночь ---------- */
  .scene { position: relative; }
  .dnlabel { position: absolute; top: 10px; left: 12px; z-index: 2; background: rgba(11,15,22,.68); border: 1px solid var(--line); border-radius: 20px; padding: 5px 13px; font-size: 12px; font-weight: 700; color: #fff; }
  .dn, .bm { transition: opacity 2.5s; }
  .sun, .cloud { opacity: 0; } .night { opacity: 1; }
  .scene.day .sun, .scene.day .cloud { opacity: 1; } .scene.day .night, .scene.day .bm { opacity: 0; }
  #sky stop, #wn stop, #gs stop, #bal stop { transition: stop-color 2.5s; }
  .scene.day #sky stop:first-child { stop-color: #3c8fdc; } .scene.day #sky stop:last-child { stop-color: #b4dcf6; }
  .scene.day #wn stop:first-child { stop-color: #d6eefb; } .scene.day #wn stop:last-child { stop-color: #86b8d8; }
  .scene.day #gs stop:first-child { stop-color: #356f3d; } .scene.day #gs stop:last-child { stop-color: #1f4a28; }
  .scene.day #bal stop:first-child { stop-color: #8c9096; } .scene.day #bal stop:last-child { stop-color: #4f5459; }
  @media (min-width: 961px) { .nav { min-width: 0; overflow-x: auto; scrollbar-width: none; } .nav::-webkit-scrollbar { display: none; } .mi { flex: none; } }
  /* ---------- Переход между страницами ---------- */
  .main { overflow-x: clip; }
  @keyframes pgf { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes pgb { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes pgs { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pg-fwd { animation: pgf .38s cubic-bezier(.22,.8,.3,1) both; }
  .pg-back { animation: pgb .38s cubic-bezier(.22,.8,.3,1) both; }
  .pg-swap { animation: pgs .26s ease-out both; }
  body.no-anim .pg-fwd, body.no-anim .pg-back, body.no-anim .pg-swap { animation: none; }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function view(route) {
    if (route.split(':')[0] === 'adm') { return hasTab('admin') ? admView(route) : denied(); }
    if (route === 'depots') {
      return { title: 'Выбор депо', html: '<div class="content">' +

          return '<button class="row" data-go="depot:' + k + '"><span>' + esc(DEPOTS[k].name) +

        }).join('') + '</div>' };
    }
    if (/^staff(:|$)/.test(route)) { return staffView(route); }
    if (route.indexOf('worker:') === 0) { return workerView(route); }
    if (route.indexOf('depot:') === 0) { return depotView(route); }
    if (route === 'prio') { return hasTab('mon') ? prioView() : denied(); }
    if (route.indexOf('repairs') === 0) { return hasTab('plan') ? repairsView(route) : denied(); }
    if (/^(crew|col|brig):/.test(route) && !can('crew')) { return denied(); }
    if (route.indexOf('crew:') === 0) { return crewView(route); }
    if (route.indexOf('brig:') === 0) { return brigView(route); }
    if (route.indexOf('col:') === 0) { return colView(route); }
    if (route.indexOf('loco:') === 0) { return locoView(route); }
    if (route === 'profile') {
      var ro = ROLES[session], ini = ro.person.split(' ').slice(0, 2).map(function (w) { return w[0]; }).join('');
      var access = ro.tabs.map(function (t) { return TAB_NAMES[t]; });
      if (ro.crew) access.push('Колонны и бригады');
      if (ro.act) access.push('Управление мониторингом');
      return { title: 'Профиль', html: '<div class="content">' +
        '<div class="avatar">' + esc(ini) + '</div>' +
        '<div class="pname">' + esc(ro.person) + '</div>' +
        '<div class="prole">' + esc(ro.name) + '</div>' +

          '<div class="msgs" id="msgs"></div>' +
          '<div class="composer">' +
            '<textarea id="input" rows="1" placeholder="Напишите сообщение"></textarea>' +

          '</div>' +
        '</div>' };

    if (route === 'settings') { return { title: 'Настройки', html: settingsHtml() }; }
    return { title: '', html: '<div class="stub-body"><p>Временно не работает</p></div>' };

  /* ---------- Чат ---------- */
  function renderMsgs() {
    var box = document.getElementById('msgs');
    if (!box) return;
    box.innerHTML = '';
    if (!chatHistory.length) {
      box.classList.add('is-empty');
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></div>';
      var t = document.createElement('div');
      t.textContent = 'Ваш личный товарищ где вы можете найти нужную информацию';
      e.appendChild(t);
      box.appendChild(e);
      return;
    }
    box.classList.remove('is-empty');
    chatHistory.forEach(function (m) {
      var b = document.createElement('div');
      b.className = 'bubble ' + (m.role === 'user' ? 'me' : 'ai') + (m.err ? ' err' : '');
      b.textContent = m.content;
      box.appendChild(b);
    });
    box.scrollTop = box.scrollHeight;
  }

  function initChat() {
    var input = document.getElementById('input');
    var send = document.getElementById('send');
    renderMsgs();

    function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
    input.addEventListener('input', grow);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });
    send.addEventListener('click', go);

    async function go() {
      var text = input.value.trim();
      if (!text || chatBusy) return;
      input.value = ''; grow();
      chatBusy = true; send.disabled = true;

      chatHistory.push({ role: 'user', content: text });
      var reply = { role: 'assistant', content: 'Иван печатает…' };
      chatHistory.push(reply);
      renderMsgs();

      // Память не хранится между вызовами: отправляем всю историю + правила в первом сообщении
      var payload = chatHistory.slice(0, -1).filter(function (m) { return !m.err; }).map(function (m) { return { role: m.role, content: m.content }; });
      payload[0] = { role: 'user', content: IVAN_RULES + '\n\nСообщение пользователя: ' + payload[0].content };

      try {
        var sample = (window.claude && window.claude.use) ? await window.claude.use('sample') : null;
        if (!sample) throw { code: 'unavailable' };
        var res = await sample(payload, {
          cache: false,
          onText: function (t) {
            reply.content = t.text;
            var last = document.querySelector('#msgs .bubble:last-child');
            if (last) { last.textContent = reply.content; document.getElementById('msgs').scrollTop = 1e9; }
          }
        });
        reply.content = res.text || reply.content;
      } catch (err) {
        reply.err = true;
        reply.content = (err && err.code === 'not_granted') ? 'Доступ к ИИ не разрешён. Разрешите его и попробуйте ещё раз.'

          : 'Иван сейчас недоступен. Попробуйте позже.';
      }
      chatBusy = false; send.disabled = false;
      if (document.getElementById('msgs')) renderMsgs();
    }
  }

  /* ---------- Навигация ---------- */

    if (!stack.length) {
      page.classList.remove('active');
      home.classList.add('active');
      renderHome();
      if (fresh) { home.scrollTop = 0; window.scrollTo(0, 0); animateIn(home, dirn); }
      return;
    }
    var v = view(stack[stack.length - 1]);
    titleEl.textContent = v.title;

  /* ================= День / ночь каждые 2 минуты ================= */
  var DN_T0 = Date.now(), DN_MS = 120000, sceneEl = document.getElementById('scene'), dnLab = document.getElementById('dnlabel'), scSvg = document.getElementById('scene-svg');
  function dnTick() {
    var el = Date.now() - DN_T0, day = Math.floor(el / DN_MS) % 2 === 0, s = Math.ceil((DN_MS - el % DN_MS) / 1000);
    sceneEl.classList.toggle('day', day);
    scSvg.setAttribute('aria-label', 'Электровоз KZ4AT КТЖ с тремя пассажирскими вагонами ' + (day ? 'днём' : 'ночью'));
    dnLab.textContent = day ? 'День' : 'Ночь';
  }
  dnTick(); setInterval(dnTick, 1000);

  render();
</script>
</body>
</html>
